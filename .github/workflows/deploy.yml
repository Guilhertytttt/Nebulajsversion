name: Deploy to IPFS via Pinata

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build
        run: |
          # Create a dummy config.toml if it's missing so the server script doesn't crash
          if [ ! -f config.toml ]; then touch config.toml; fi
          
          # Install everything using legacy-peer-deps to avoid Svelte 4 vs 5 conflicts
          npm install --legacy-peer-deps
          npm install -D @astrojs/check --legacy-peer-deps
          
          npm run build

      - name: Upload to Pinata
        uses: anantaramdas/ipfs-pinata-deploy-action@v1.6.4
        with:
          pin-name: 'Nebulajsversion Permanent Build'
          path: './dist'
          pinata-api-key: ${{ secrets.PINATA_JWT }}
          pinata-secret-api-key: ''
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
